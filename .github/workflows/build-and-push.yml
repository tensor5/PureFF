name: Build and push container image

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: tensor5
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build image
        run: nix build .#containerImage
      - name: Push image to GHCR
        run: |
          nix run .#containerImage.copyToRegistry -- \
            --dest-username ${{ github.actor }} \
            --dest-password ${{ github.token }}
