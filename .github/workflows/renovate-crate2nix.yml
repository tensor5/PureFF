name: Update Cargo.nix for Renovate

on:
  pull_request:
    paths:
      - Cargo.lock

jobs:
  crate2nix:
    name: Regenerate Cargo.nix
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.sender.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 2

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31

      - name: Regenerate Cargo.nix
        run: nix develop --command crate2nix generate

      - name: Amend Renovate commit
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- Cargo.nix; then
            echo "Cargo.nix is already up to date."
            exit 0
          fi

          git add Cargo.nix
          git commit --amend --no-edit
          git push --force-with-lease origin "HEAD:${HEAD_REF}"
